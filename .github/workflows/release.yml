name: Build ShadowVPN (Rust musl + HW Accel)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-musl
            # x86_64 开启 AES-NI 和 PCLMUL 加速
            rustflags: "-C target-feature=+aes,+pclmul"
            
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            # AArch64 (ARMv8) 开启 AES 和 NEON 硬件加速（根据 README 推荐）
            rustflags: "-C target-feature=+aes,+neon"
            
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
            # ARMv7 开启 NEON 向量指令集加速
            rustflags: "-C target-feature=+neon"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # 1. 安装对应架构的 Rust musl target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 2. 安装 cross (Rust 极速交叉编译工具)
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # 3. 注入 RUSTFLAGS 并使用 cross 进行静态编译
      - name: Build ShadowVPN
        run: cross build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # 4. 上传编译好的纯静态 musl 二进制文件
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowvpn-${{ matrix.arch }}-musl
          path: target/${{ matrix.target }}/release/shadowvpn
