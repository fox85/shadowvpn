name: Build ShadowVPN (Rust musl + HW Accel)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-musl
            # 修正：使用正确的 LLVM target feature 名称 pclmulqdq
            rustflags: "-C target-feature=+aes,+pclmulqdq"
            
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            rustflags: "-C target-feature=+aes,+neon"
            
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
            rustflags: "-C target-feature=+neon"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build ShadowVPN
        run: cross build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # 调试步骤：打印 release 目录下的所有文件，方便在 Action 日志中查看实际的二进制名字
      - name: Show compiled files (Debug)
        run: |
          echo "Listing compiled release artifacts:"
          ls -la target/${{ matrix.target }}/release/

      # 修正：使用通配符上传所有以 shadowvpn 开头的文件（包括可能存在的 -server / -client）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowvpn-${{ matrix.arch }}-musl
          path: |
            target/${{ matrix.target }}/release/shadowvpn
            target/${{ matrix.target }}/release/shadowvpn-server
            target/${{ matrix.target }}/release/shadowvpn-client
          # 如果文件不存在，Action 会抛出明确错误，而不是静默失败
          if-no-files-found: warn
