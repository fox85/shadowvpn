name: Build ShadowVPN (musl + HW Accel)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            arch: x86_64
            # x86_64 开启 AES-NI 硬件加速
            hw_cflags: "-maes -mpclmul"
            
          - name: aarch64
            arch: aarch64
            # ARMv8 开启 NEON 和 Crypto (AES/SHA) 扩展
            hw_cflags: "-march=armv8-a+crypto"
            
          - name: armv7
            arch: armv7
            # ARMv7 开启 NEON 向量指令集加速
            hw_cflags: "-mfpu=neon"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: madeye/shadowvpn
          submodules: recursive # 必须递归拉取 libsodium

      - name: Build in Alpine (Native musl with HW Crypto)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          run: |
            # 1. 安装编译依赖
            apk update
            apk add --no-cache build-base autoconf automake libtool linux-headers git file pkgconf

            # 2. 生成 configure 脚本
            ./autogen.sh

            # 3. 配置编译参数，注入对应架构的硬件加速 CFLAGS
            ./configure \
              --enable-static \
              CFLAGS="-O3 -static ${{ matrix.hw_cflags }}" \
              LDFLAGS="-static"
            
            # 4. 编译 (ShadowVPN 及其内建的 libsodium 将会以硬件加速模式被编译)
            make -j$(nproc)
            
            # 5. 验证编译产物
            file src/shadowvpn

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowvpn-${{ matrix.name }}-musl
          path: src/shadowvpn
