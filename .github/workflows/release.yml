name: Cross-compile ShadowVPN (musl)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # 允许手动触发工作流

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-linux-musl
          - arch: aarch64
            target: aarch64-linux-musl
          - arch: armv7
            target: arm-linux-musleabihf

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: madeye/shadowvpn
          # ShadowVPN 依赖 libsodium，必须递归拉取子模块
          submodules: recursive 

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential wget tar

      - name: Download and Setup musl.cc Toolchain
        run: |
          # 从 musl.cc 下载对应架构的交叉编译工具链
          wget https://musl.cc/${{ matrix.target }}-cross.tgz
          tar -xf ${{ matrix.target }}-cross.tgz
          # 将工具链的 bin 目录加入环境变量 PATH
          echo "$GITHUB_WORKSPACE/${{ matrix.target }}-cross/bin" >> $GITHUB_PATH

      - name: Build ShadowVPN
        run: |
          # 生成 configure 脚本
          ./autogen.sh
          
          # 配置为静态交叉编译
          ./configure \
            --host=${{ matrix.target }} \
            CC=${{ matrix.target }}-gcc \
            CXX=${{ matrix.target }}-g++ \
            --enable-static \
            CFLAGS="-O2 -static" \
            LDFLAGS="-static"
            
          # 多核编译加速
          make -j$(nproc)
          
          # 检查编译出来的文件信息（可选，方便在 Action 日志中确认）
          file src/shadowvpn

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowvpn-${{ matrix.arch }}-musl
          path: src/shadowvpn
